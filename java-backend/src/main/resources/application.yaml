spring:
  application:
    name: voxticket

  # Virtual threads for blocking SSE / LLM / database turns.
  threads:
    virtual:
      enabled: true

  # Empty host = no SMTP. OTP delivery defaults to dev (no mail sent);
  # set MAIL_* below and voxticket.otp.delivery=email for real mail.
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/voxticket2.0}
    username: ${DB_USERNAME:muzammil}
    password: ${DB_PASSWORD:local-dev-only-not-a-real-secret}

  flyway:
    enabled: true

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  ai:
    model:
      chat: none
      embedding: ollama
      audio:
        speech: none
        transcription: none
      image: none
      moderation: none

    chat:
      client:
        enabled: false

    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      embedding:
        model: bge-m3

    vectorstore:
      pgvector:
        initialize-schema: false
        schema-validation: true
        dimensions: 1024
        index-type: HNSW
        distance-type: COSINE_DISTANCE

    tools:
      limits:
        max-calls-per-tool-default: 5
        max-total-tool-calls: 10
        on-limit-exceeded: THROW

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  # Mail is an optional OTP channel, not a core dependency: with no SMTP
  # host configured, the mail indicator alone must not make /health 503.
  health:
    mail:
      enabled: false

voxticket:
  commerce:
    returns:
      window-days: 30

  # Admin console (/api/v1/admin/**, HTTP Basic). A default password
  # logs a loud startup warning; change both for anything beyond local.
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:admin}

  voice:
    telemetry-secret: ${VOICE_TELEMETRY_SECRET:}
    livekit:
      url: ${LIVEKIT_URL:}
      api-key: ${LIVEKIT_API_KEY:}
      api-secret: ${LIVEKIT_API_SECRET:}

  ai:
    # 0.0 = unknown, excluded from the cost estimate.
    cost:
      per-1k-tokens:
        "gemini-3.5-flash-lite": 0.0
        "openai/gpt-oss-120b": 0.0

    # Keys come from env only, never from this file. A tier referencing
    # a provider with a blank key fails startup. Google uses the native
    # GenAI SDK (no base-url); Groq and Cerebras are OpenAI-compatible.
    providers:
      google:
        enabled: true
        api-key: ${GEMINI_API_KEY:}
      groq:
        enabled: true
        api-key: ${GROQ_API_KEY:}
        base-url: https://api.groq.com/openai/v1
      cerebras:
        enabled: true
        api-key: ${CEREBRAS_API_KEY:}
        base-url: https://api.cerebras.ai/v1

    # Tier 1: simple turns. Tier 2: complex / multi-part turns.
    # The router decides only the tier, never the provider or model.
    tiers:
      tier1:
        provider: GOOGLE
        model: gemini-3.5-flash-lite
        temperature: 0.7
        max-output-tokens: 800
        reasoning-effort: low
        timeout-seconds: 20
        max-retries: 0
      tier2:
        provider: GROQ
        model: openai/gpt-oss-120b
        temperature: 0.7
        max-output-tokens: 3072
        reasoning-effort: medium
        timeout-seconds: 20
        max-retries: 0

    selector:
      strategy: HYBRID
      structural:
        long-message-threshold: 300
        min-order-references-for-tier2: 2
      semantic:
        enabled: true
        # Local ONNX settings. Ignored when voxticket.routing.provider
        # is voyage. Directory must contain model.onnx + tokenizer.json
        # (intfloat/multilingual-e5-small, ONNX).
        model: intfloat/multilingual-e5-small
        model-path: ${ROUTING_MODEL_PATH:}
        examples: classpath:routing/examples-v1.json
        top-k-per-class: 3
        complex-margin: 0.02
        simple-margin: 0.01135858377758675

  rag:
    top-k: 3
    similarity-threshold: 0.35

  safety:
    prompt-guard:
      provider: heuristic
      ml-model: meta-llama/llama-prompt-guard-2-86m
      ml-threshold: 0.5
      ml-max-tokens: 10

  # Embedding models, set independently.
  # embedding = RAG (pgvector). routing = tier-routing prototypes.
  # Each provider is local or voyage. A voyage provider with a blank
  # key fails startup; it never falls back silently to local, because
  # that would mix vector spaces.
  # Routing key / base-url / timeout fall back to the embedding values
  # when not set separately, so one Voyage key normally covers both.
  # voyage-4-lite: 1024 dims, $0.02/1M tokens, 200M free. voyage-4
  # ($0.06) and voyage-4-large ($0.12) share 1024 dims; changing the
  # embedding model re-embeds RAG automatically, routing prototypes
  # are re-embedded at every startup.
  embedding:
    provider: ${VOXTICKET_EMBEDDING_PROVIDER:local}
    voyage:
      api-key: ${VOYAGE_API_KEY:}
      model: ${VOYAGE_MODEL:voyage-4-lite}
      base-url: ${VOYAGE_BASE_URL:https://api.voyageai.com/v1}
      timeout-seconds: ${VOYAGE_TIMEOUT_SECONDS:5}
  routing:
    provider: ${VOXTICKET_ROUTING_PROVIDER:local}
    voyage:
      api-key: ${VOYAGE_ROUTING_API_KEY:${VOYAGE_API_KEY:}}
      model: ${VOYAGE_ROUTING_MODEL:voyage-4-lite}
      base-url: ${VOYAGE_ROUTING_BASE_URL:${VOYAGE_BASE_URL:https://api.voyageai.com/v1}}
      timeout-seconds: ${VOYAGE_ROUTING_TIMEOUT_SECONDS:${VOYAGE_TIMEOUT_SECONDS:5}}

  otp:
    expiry-minutes: 5
    max-attempts: 3
    resend-cooldown-seconds: 60
    max-challenges-per-customer-per-hour: 5
    max-challenges-per-session: 5
    email-from: ${MAIL_FROM:no-reply@voxticket.example}
    # dev = no mail sent. email = real mail via spring.mail above;
    # requires MAIL_HOST / MAIL_USERNAME / MAIL_PASSWORD.
    delivery: ${VOXTICKET_OTP_DELIVERY:dev}

  # Procedure notification emails (cancellation, return, claim, refund).
  # Independent of OTP delivery above: OTP can stay on dev while these
  # go by email. The From address is voxticket.otp.email-from (MAIL_FROM).
  # enabled=true with no SMTP host simply skips sending; a mail failure
  # never fails the procedure itself.
  notifications:
    email:
      enabled: true

  audit:
    queue-capacity: 8192
    batch-size: 200
    flush-interval-ms: 250
