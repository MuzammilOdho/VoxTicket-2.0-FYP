<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VoxTicket Voice Call</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
  #status { padding: .6rem 1rem; border-radius: 8px; background: #f0f0f0; margin: 1rem 0; }
  #status.live { background: #e6f7e6; }
  #status.error { background: #fde8e8; }
  button { font-size: 1.1rem; padding: .6rem 1.4rem; margin-right: .5rem; cursor: pointer; }
  #captions { border: 1px solid #ddd; border-radius: 8px; min-height: 120px; padding: 1rem; margin-top: 1rem; }
  #captions p { margin: .4rem 0; }
  .who { font-weight: bold; }
  .interim { opacity: .55; }
</style>
</head>
<body>
<h1>VoxTicket Voice Call</h1>
<div id="status">Idle — click <b>Start Call</b> and allow the microphone.</div>
<button id="startBtn">Start Call</button>
<button id="endBtn" disabled>End Call</button>
<div id="captions" aria-live="polite"></div>

<script type="module">
import { Room, RoomEvent, Track } from 'https://cdn.jsdelivr.net/npm/livekit-client@2/+esm';

const JAVA_BASE = window.location.origin; // page is served from the Spring Boot app: same origin, no CORS
const statusEl = document.getElementById('status');
const captionsEl = document.getElementById('captions');
const startBtn = document.getElementById('startBtn');
const endBtn = document.getElementById('endBtn');

let room = null;
let roomName = null;

function setStatus(text, cls = '') {
  statusEl.innerHTML = text;
  statusEl.className = cls;
}

function addCaption(who, text, interim) {
  const p = document.createElement('p');
  if (interim) p.className = 'interim';
  const w = document.createElement('span');
  w.className = 'who';
  w.textContent = who + ': ';
  p.appendChild(w);
  p.appendChild(document.createTextNode(text));
  captionsEl.appendChild(p);
  captionsEl.scrollTop = captionsEl.scrollHeight;
}

async function startCall() {
  startBtn.disabled = true;
  setStatus('Getting call token…');
  try {
    roomName = 'voxticket-' + crypto.randomUUID().slice(0, 8);
    const res = await fetch(`${JAVA_BASE}/api/v1/voice/token?room=${encodeURIComponent(roomName)}`);
    if (!res.ok) throw new Error(`token endpoint returned ${res.status}`);
    const { url, token } = await res.json();

    setStatus('Connecting to voice server…');
    room = new Room();

    room.on(RoomEvent.TrackSubscribed, (track, _pub, participant) => {
      if (track.kind === Track.Kind.Audio) {
        const el = track.attach();
        el.autoplay = true;
        document.body.appendChild(el);
        setStatus(`🔊 ${participant.identity} speaking…`, 'live');
      }
    });
    room.on(RoomEvent.TrackUnsubscribed, (track) => {
      track.detach().forEach(el => el.remove());
    });
    room.on(RoomEvent.TranscriptionReceived, (segments) => {
      for (const s of segments) {
        const who = s.participantIdentity.startsWith('agent') ? 'Agent' : 'You';
        addCaption(who, s.text, !s.final);
      }
    });
    room.on(RoomEvent.ActiveSpeakersChanged, (speakers) => {
      if (room && room.state === 'connected') {
        setStatus(speakers.length ? '🔊 Agent speaking…' : '🎙️ Listening…', 'live');
      }
    });
    room.on(RoomEvent.Disconnected, () => endCallUI('Call ended.'));

    await room.connect(url, token);
    await room.localParticipant.setMicrophoneEnabled(true);

    setStatus('🎙️ Live — waiting for the agent to join…', 'live');
    endBtn.disabled = false;
  } catch (err) {
    console.error(err);
    setStatus(`❌ ${err.message}`, 'error');
    startBtn.disabled = false;
  }
}

function endCallUI(msg) {
  setStatus(msg || 'Idle — click <b>Start Call</b> and allow the microphone.');
  startBtn.disabled = false;
  endBtn.disabled = true;
  room = null;
}

async function endCall() {
  endBtn.disabled = true;
  try { await room?.disconnect(); } catch (e) { console.error(e); }
  endCallUI();
}

startBtn.addEventListener('click', startCall);
endBtn.addEventListener('click', endCall);
window.addEventListener('beforeunload', () => { room?.disconnect(); });
</script>
</body>
</html>
