spring:
  application:
    name: voxticket

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/voxticket2.0}
    username: ${DB_USERNAME:muzammil}
    password: ${DB_PASSWORD:local-dev-only-not-a-real-secret}

  flyway:
    enabled: true

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  ai:
    model:
      chat: none
      embedding: ollama
      audio:
        speech: none
        transcription: none
      image: none
      moderation: none

    chat:
      client:
        enabled: false

    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      embedding:
        model: bge-m3

    vectorstore:
      pgvector:
        initialize-schema: false
        schema-validation: true
        dimensions: 1024
        index-type: HNSW
        distance-type: COSINE_DISTANCE

    tools:
      limits:
        max-calls-per-tool-default: 5
        max-total-tool-calls: 10
        on-limit-exceeded: THROW

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus

voxticket:
  commerce:
    returns:
      window-days: 30
  ai:
    # Each tier independently names exactly one provider and one model.
    # Switching either is a config-only change: no Java changes, no fallback
    # and no cross-provider routing. ModelSelector decides ONLY the tier
    # (TIER_1 / TIER_2); TierChatClientRegistry builds the matching client.
    providers:
      # enabled:  true | false - master switch for the provider block.
      # api-key:  read ONLY from an environment variable, never paste a key
      #           into this file. If a tier references a provider whose key is
      #           missing or blank, the application fails fast at startup.
      # base-url: OpenAI-compatible providers (Groq, Cerebras) only. Google
      #           uses the native GenAI SDK - no base-url required or used.
      google:
        enabled: true
        api-key: ${GEMINI_API_KEY:}
      groq:
        enabled: true
        api-key: ${GROQ_API_KEY:}
        base-url: https://api.groq.com/openai/v1
      cerebras:
        enabled: true
        api-key: ${CEREBRAS_API_KEY:}
        base-url: https://api.cerebras.ai/v1

    # Per-tier options:
    #
    #   provider:          GROQ | GOOGLE | CEREBRAS - must match a block above.
    #   model:             Groq/Cerebras: provider model ID, e.g.
    #                        openai/gpt-oss-120b, openai/gpt-oss-20b,
    #                        qwen/qwen3.8-27b
    #                      Google: enum name, e.g. gemini-3.5-flash-lite,
    #                        gemini-2.5-flash, gemini-3.5-flash,
    #                        gemini-3.6-flash, gemini-2.5-flash-lite
    #                      (dashes or UPPER_SNAKE both work; unknown names fail
    #                      fast at startup with the supported list).
    #   temperature:       0.0 - 2.0. Lower = more deterministic. Not sent to
    #                      Gemini 3.x models (their API deprecates it).
    #   max-output-tokens: positive int. Output budget per turn, including
    #                      hidden reasoning tokens on reasoning models.
    #   reasoning-effort:  none | low | medium | high. Provider-specific:
    #                        groq:     none -> reasoning_effort omitted
    #                                  (include_reasoning=false always sent);
    #                                  low|medium|high -> sent natively.
    #                        cerebras: none -> omitted; low|medium|high -> sent.
    #                        google:   none -> default thinking, thoughts
    #                                  suppressed; low|medium|high -> native
    #                                  thinking level, thoughts never returned.
    #                      Reasoning is never shown to the customer.
    #   timeout-seconds:   positive int. Per-request timeout.
    #   max-retries:       0+. Automatic provider retries after the first
    #                      attempt. Keep 0 - failures must surface immediately.
    tiers:
      # TIER_1: simple queries (policy questions, order status, escalation).
      tier1:
        provider: GOOGLE
        model: gemini-3.5-flash-lite
        temperature: 0.3
        max-output-tokens: 800
        reasoning-effort: low
        timeout-seconds: 20
        max-retries: 0
      # TIER_2: complex / multi-part queries (comparisons, disputes, claims).
      tier2:
        provider: GROQ
        model: openai/gpt-oss-120b
        temperature: 0.3
        max-output-tokens: 3072
        reasoning-effort: medium
        timeout-seconds: 20
        max-retries: 0

    selector:
      # The router decides ONLY the tier (TIER_1/TIER_2) - never provider/model.
      # HYBRID = structural strong signals, then local multilingual-e5 semantic
      # scoring. Requires the routing model artifacts: set ROUTING_MODEL_PATH
      # to a directory containing model.onnx + tokenizer.json (download once
      # from https://huggingface.co/intfloat/multilingual-e5-small/tree/main/onnx).
      # Startup fails fast with an actionable error if they are missing.
      #
      #   strategy:               HYBRID | ALWAYS_TIER_1 | ALWAYS_TIER_2 | RULE_ONLY
      #   structural.long-message-threshold:      chars; longer messages -> TIER_2.
      #   structural.min-order-references-for-tier2: order refs; at/above -> TIER_2.
      #   semantic.enabled:       true | false - multilingual-e5 semantic scoring.
      #   semantic.model:         embedding model id (informational).
      #   semantic.model-path:    directory with model.onnx + tokenizer.json.
      #   semantic.examples:      labeled example set for prototype scoring.
      #   semantic.top-k-per-class: prototypes kept per class for scoring.
      #   semantic.complex-margin: selects the TIER_2 reason label
      #                            (SEMANTIC_COMPLEX vs SEMANTIC_AMBIGUOUS);
      #                            never changes the tier.
      #   semantic.simple-margin:  semantic score threshold separating
      #                            SEMANTIC_SIMPLE (TIER_1) from the ambiguous
      #                            band (TIER_2). Calibrated value - retune only
      #                            with a labeled validation set.
      strategy: HYBRID
      structural:
        long-message-threshold: 300
        min-order-references-for-tier2: 2
      semantic:
        enabled: true
        model: intfloat/multilingual-e5-small
        model-path: ${ROUTING_MODEL_PATH:}
        examples: classpath:routing/examples-v1.json
        top-k-per-class: 3
        complex-margin: 0.02
        simple-margin: 0.01135858377758675
  rag:
    # top-k:                positive int. Knowledge chunks retrieved per turn.
    # similarity-threshold: 0.0 - 1.0. Minimum cosine similarity for a chunk
    #                       to be included in the prompt context.
    top-k: 3
    similarity-threshold: 0.35
  safety:
    prompt-guard:
      # provider:   ml | heuristic - ML classifier with heuristic fallback.
      # ml-model:   Groq classifier model id for prompt-injection scoring.
      # ml-threshold: 0.0 - 1.0. Score at/above -> message flagged suspicious.
      # ml-max-tokens: output cap for the classifier call (single score).
      provider: ml
      ml-model: meta-llama/llama-prompt-guard-2-86m
      ml-threshold: 0.5
      ml-max-tokens: 10
  otp:
    expiry-minutes: 5
    max-attempts: 3
    resend-cooldown-seconds: 60
    max-challenges-per-customer-per-hour: 5
    max-challenges-per-session: 5
    email-from: no-reply@voxticket.example
    # delivery: not set here on purpose - defaults to "dev" in dev/test profiles.
    # Set to "email" (plus real spring.mail.* config) to switch delivery.
