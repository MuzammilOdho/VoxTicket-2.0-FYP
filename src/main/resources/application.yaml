spring:
  application:
    name: voxticket

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/voxticket2.0}
    username: ${DB_USERNAME:muzammil}
    password: ${DB_PASSWORD:local-dev-only-not-a-real-secret}

  flyway:
    enabled: true

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  ai:
    model:
      # "none" disables every unused Spring AI model auto-configuration
      # (openai, google-genai, ollama chat/image/speech/...). The exact
      # condition properties were verified against the Spring AI 2.0.1 JARs:
      #   spring.ai.model.chat=openai|google-genai|ollama (matchIfMissing)
      #   spring.ai.model.embedding=openai|google-genai-text|ollama
      #   spring.ai.model.image=openai|google-genai
      #   spring.ai.model.audio.speech=openai
      #   spring.ai.model.audio.transcription=openai
      #   spring.ai.model.moderation=openai
      # Conversation chat clients are constructed manually per tier from
      # voxticket.ai.providers / voxticket.ai.tiers via TierChatClientRegistry
      # and ProviderChatModelFactory - no auto-configured ChatModel is used.
      # Embedding stays on Ollama (bge-m3).
      chat: none
      embedding: ollama
      audio:
        speech: none
        transcription: none
      image: none
      moderation: none

    chat:
      client:
        # The global ChatClient.Builder auto-configuration is disabled:
        # every conversation client is built manually per tier by
        # TierChatClientRegistry, and nothing injects the auto-configured
        # builder (verified by codebase search). The opt-in ML prompt guard
        # also builds its own client from ProviderChatModelFactory.
        enabled: false

    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      embedding:
        model: bge-m3

    vectorstore:
      pgvector:
        initialize-schema: false
        schema-validation: true
        dimensions: 1024
        index-type: HNSW
        distance-type: COSINE_DISTANCE

    tools:
      limits:
        max-calls-per-tool-default: 5
        max-total-tool-calls: 10
        on-limit-exceeded: THROW

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus

voxticket:
  commerce:
    returns:
      window-days: 30
  ai:
    # Phase 1 provider/model configuration. Each tier independently names exactly
    # one provider and one model - switching either is a config-only change, no
    # Java changes, no fallback or cross-provider routing.
    #
    # GOOGLE tiers use the native Spring AI Google GenAI integration
    # (GoogleGenAiChatModel on the official GenAI SDK, API-key mode) - NOT an
    # OpenAI-compatible endpoint. No base-url is required or used for Google.
    # The Google model must be one of GoogleGenAiChatModel.ChatModel's enum
    # values, e.g. gemini-2.5-flash, gemini-3.5-flash, gemini-3.6-flash,
    # gemini-2.5-pro (verified against the Spring AI 2.0.1 JARs) - anything
    # else fails fast at startup with the supported list.
    #
    # GROQ and CEREBRAS tiers use OpenAiChatModel against their
    # OpenAI-compatible endpoints:
    #   groq     -> https://api.groq.com/openai/v1
    #   cerebras -> https://api.cerebras.ai/v1
    #
    # API keys come ONLY from environment variables, never from config files.
    providers:
      google:
        enabled: true
        api-key: ${GEMINI_API_KEY:}
      groq:
        enabled: true
        api-key: ${GROQ_API_KEY:}
        base-url: https://api.groq.com/openai/v1
      cerebras:
        enabled: true
        api-key: ${CEREBRAS_API_KEY:}
        base-url: https://api.cerebras.ai/v1

    # reasoning-effort semantics are provider-specific (see ProviderChatModelFactory):
    #   groq:     none -> omit reasoning_effort + include_reasoning=false (Groq-only field)
    #             low|medium|high -> reasoning_effort=<value> + include_reasoning=false
    #   cerebras: none -> omit reasoning_effort; low|medium|high -> reasoning_effort=<value>
    #             (never include_reasoning)
    #   google:   none -> default thinking, thoughts suppressed; low|medium|high ->
    #             native thinking level, thoughts never returned
    tiers:
      tier1:
        provider: GROQ
        model: qwen/qwen3.8-27b
        temperature: 0.3
        max-output-tokens: 1000
        reasoning-effort: low
        timeout-seconds: 20
        max-retries: 0
      tier2:
        provider: GROQ
        model: openai/gpt-oss-120b
        temperature: 0.3
        max-output-tokens: 1536
        reasoning-effort: medium
        timeout-seconds: 20
        max-retries: 0

    selector:
      # Phase 2: the router decides ONLY the tier (TIER_1/TIER_2) - never provider/model.
      # HYBRID = structural strong signals, then local multilingual-e5 semantic scoring.
      # HYBRID requires the routing model artifacts: set ROUTING_MODEL_PATH to a directory
      # containing model.onnx + tokenizer.json (download once from
      # https://huggingface.co/intfloat/multilingual-e5-small/tree/main/onnx).
      # Startup fails fast with an actionable error if they are missing.
      strategy: HYBRID
      structural:
        long-message-threshold: 300
        min-order-references-for-tier2: 2
      semantic:
        enabled: true
        model: intfloat/multilingual-e5-small
        model-path: ${ROUTING_MODEL_PATH:}
        examples: classpath:routing/examples-v1.json
        top-k-per-class: 3
        # complex-margin is not calibrated (Phase 3 finding): it only selects the
        # TIER_2 reason label (SEMANTIC_COMPLEX vs SEMANTIC_AMBIGUOUS), never the tier.
        complex-margin: 0.02
        # Calibrated in Phase 3 on the 120-example validation set (was 0.02).
        simple-margin: 0.01135858377758675
  rag:
    top-k: 3
    similarity-threshold: 0.5
  safety:
    prompt-guard:
      provider: ml
      ml-model: meta-llama/llama-prompt-guard-2-86m
      ml-threshold: 0.5
      ml-max-tokens: 10
  otp:
    expiry-minutes: 5
    max-attempts: 3
    resend-cooldown-seconds: 60
    max-challenges-per-customer-per-hour: 5
    max-challenges-per-session: 5
    email-from: no-reply@voxticket.example
    # delivery: not set here on purpose - defaults to "dev" in dev/test profiles.
    # Set to "email" (plus real spring.mail.* config) to switch delivery.
