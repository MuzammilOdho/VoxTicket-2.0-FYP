spring:
  application:
    name: voxticket

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/voxticket2.0}
    username: ${DB_USERNAME:muzammil}
    password: ${DB_PASSWORD:6346}

  flyway:
    enabled: true


  jpa:
    hibernate:
      # Flyway is authoritative for schema. Hibernate only ever validates -
      # it must never create or alter the schema itself (spec §60).
      ddl-auto: validate
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus

# Activate with SPRING_PROFILES_ACTIVE=dev locally to enable DataSeeder and
# any dev-only beans (e.g. DevOtpDeliveryService from Phase 9).
# The "test" profile is activated automatically by @ActiveProfiles in tests.