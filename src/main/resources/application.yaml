spring:
  application:
    name: voxticket

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/voxticket2.0}
    username: ${DB_USERNAME:muzammil}
    password: ${DB_PASSWORD:local-dev-only-not-a-real-secret}

  flyway:
    enabled: true

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  ai:
    model:
      chat: openai
      embedding: ollama

    openai:
      # Backs only the opt-in ML prompt guard (voxticket.safety.prompt-guard.provider=ml).
      # The conversation chat path no longer uses this - it is wired per-tier from
      # voxticket.ai.providers / voxticket.ai.tiers below via TierChatClientRegistry.
      # The key comes only from the environment; empty is tolerated at startup
      # (verified against the exact Spring AI 2.0.1 / openai-java client path -
      # clients are built lazily and keys are only exercised on real requests).
      base-url: https://api.groq.com/openai/v1
      api-key: ${GROQ_API_KEY:}

    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      embedding:
        model: bge-m3

    vectorstore:
      pgvector:
        initialize-schema: false
        schema-validation: true
        dimensions: 1024
        index-type: HNSW
        distance-type: COSINE_DISTANCE

    tools:
      limits:
        max-calls-per-tool-default: 5
        max-total-tool-calls: 10
        on-limit-exceeded: THROW

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus

voxticket:
  commerce:
    returns:
      window-days: 30
  ai:
    # Phase 1 provider/model configuration. Each tier independently names exactly
    # one provider and one model - switching either is a config-only change, no
    # Java changes, no fallback or cross-provider routing.
    #
    # Provider base URLs verified 2026-09-26 (all OpenAI-compatible chat completions):
    #   google   -> https://generativelanguage.googleapis.com/v1beta/openai
    #   groq     -> https://api.groq.com/openai/v1
    #   cerebras -> https://api.cerebras.ai/v1
    #
    # API keys come ONLY from environment variables, never from config files.
    providers:
      google:
        enabled: true
        api-key: ${GEMINI_API_KEY:}
        base-url: https://generativelanguage.googleapis.com/v1beta/openai
      groq:
        enabled: true
        api-key: ${GROQ_API_KEY:}
        base-url: https://api.groq.com/openai/v1
      cerebras:
        enabled: true
        api-key: ${CEREBRAS_API_KEY:}
        base-url: https://api.cerebras.ai/v1

    # Model IDs verified 2026-09-26:
    #   groq     openai/gpt-oss-20b  - production, tool calling, 131K context
    #   cerebras gpt-oss-120b        - production, tool calling, no deprecation date
    #   google   gemini-3.8-flash    - GA 2026-09-02, no shutdown announced
    tiers:
      tier1:
        provider: GOOGLE
        model: gemini-3.8-flash
        temperature: 0.3
        max-output-tokens: 1024
        # none | low | medium | high. none preserves the standing behavior of never
        # exposing chain-of-thought; anything else is sent as reasoning_effort.
        reasoning-effort: none
        timeout-seconds: 20
      tier2:
        provider: GROQ
        model: gpt-oss-120b
        temperature: 0.3
        max-output-tokens: 1536
        reasoning-effort: high
        timeout-seconds: 20

    selector:
      long-message-threshold: 300
      min-order-references-for-tier2: 2
  rag:
    top-k: 3
    similarity-threshold: 0.5
  safety:
    prompt-guard:
      provider: heuristic
      ml-model: meta-llama/llama-prompt-guard-2-86m
      ml-threshold: 0.5
      ml-max-tokens: 10
  otp:
    expiry-minutes: 5
    max-attempts: 3
    resend-cooldown-seconds: 60
    max-challenges-per-customer-per-hour: 5
    max-challenges-per-session: 5
    email-from: no-reply@voxticket.example
    # delivery: not set here on purpose - defaults to "dev" in dev/test profiles.
    # Set to "email" (plus real spring.mail.* config) to switch delivery.
