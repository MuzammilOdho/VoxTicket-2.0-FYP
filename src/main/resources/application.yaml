spring:
  application:
    name: voxticket

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/voxticket2.0}
    username: ${DB_USERNAME:muzammil}
    password: ${DB_PASSWORD:6346}

  flyway:
    enabled: true

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  ai:
    model:
      chat: openai
      embedding: ollama

    openai:
      base-url: https://api.groq.com/openai/v1
      api-key: ${GROQ_API_KEY:test-key-placeholder}

    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      embedding:
        model: bge-m3

    vectorstore:
      pgvector:
        initialize-schema: false
        schema-validation: true
        dimensions: 1024
        index-type: HNSW
        distance-type: COSINE_DISTANCE

    tools:
      limits:
        on-limit-exceeded: THROW
        max-total-tool-calls: 10
        max-calls-per-tool-default: 5

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus

voxticket:
  commerce:
    returns:
      window-days: 30
  ai:
    tier1-model: openai/gpt-oss-20b
    tier2-model: openai/gpt-oss-120b
    temperature: 0.3
  rag:
    top-k: 3
    similarity-threshold: 0.5
  safety:
    prompt-guard:
      provider: ml  # set to "ml" once you've verified the real classifier against a live account
      ml-model: meta-llama/llama-prompt-guard-2-86m