spring:
  application:
    name: voxticket

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/voxticket2.0}
    username: ${DB_USERNAME:muzammil}
    password: ${DB_PASSWORD:6346}

  flyway:
    enabled: true

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  ai:
    model:
      # Explicit now that two providers are on the classpath (OpenAI-compatible for
      # chat, Ollama for embeddings) - without this, Spring Boot has two competing
      # ChatModel/EmbeddingModel candidates and autoconfiguration is ambiguous.
      chat: openai
      embedding: ollama

    openai:
      base-url: https://api.groq.com/openai/v1
      api-key: ${GROQ_API_KEY:test-key-placeholder}
      chat:
        model: openai/gpt-oss-20b
        temperature: 0.3
        extra-body:
          include_reasoning: false

    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      embedding:
        model: nomic-embed-text

    vectorstore:
      pgvector:
        initialize-schema: false
        schema-validation: true
        dimensions: 768
        index-type: HNSW
        distance-type: COSINE_DISTANCE

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus

voxticket:
  commerce:
    returns:
      window-days: 30
  ai:
    tier1-model: openai/gpt-oss-20b
    tier2-model: openai/gpt-oss-120b